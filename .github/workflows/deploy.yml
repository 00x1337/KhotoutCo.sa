name: Deploy Next.js to CloudPanel VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Copy files to VPS temp directory
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "out/*"
          target: "/home/ubuntu/KhotoutCo.sa-temp"
          strip_components: 1

      - name: Sync files to CloudPanel directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            sudo rsync -a --delete /home/ubuntu/KhotoutCo.sa-temp/ /home/khotout/htdocs/khotoutco.sa/
            sudo chown -R khotout:khotout /home/khotout/htdocs/khotoutco.sa/
            rm -rf /home/ubuntu/KhotoutCo.sa-temp/
